{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm p-4">
      <h3 class="mb-3">Admin / Staff Login</h3>
      <p class="text-muted small">This is only for admin/staff accounts. Normal customers can <a href="{% url 'accounts:login_phone_start' %}">log in with their phone number here</a>.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100" type="submit">Login</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
