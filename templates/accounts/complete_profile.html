{% extends "base.html" %}
{% block title %}Complete Profile{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm p-4">
      <h3 class="mb-1">Almost done!</h3>
      <p class="text-muted small">Phone <strong>{{ phone }}</strong> has been verified. Now fill in the remaining details.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-success w-100" type="submit">Create Account</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
