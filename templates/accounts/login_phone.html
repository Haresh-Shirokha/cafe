{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm p-4">
      <h3 class="mb-1">Login</h3>
      <p class="text-muted small">Enter your phone number and an OTP will be sent to you.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100" type="submit">Send OTP</button>
      </form>
      <p class="mt-3">New here? <a href="{% url 'accounts:signup_phone_start' %}">Sign up</a></p>
      <p class="small text-muted mt-2"><a href="{% url 'accounts:login' %}">Admin/Staff? Log in with username & password</a></p>
    </div>
  </div>
</div>
{% endblock %}
